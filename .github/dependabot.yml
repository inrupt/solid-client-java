version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "30 4 1,15 * *"
    ignore:
      # Stay on the Quarkus 3.x line; major upgrades are handled manually, not via Dependabot.
      - dependency-name: "io.quarkus:*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "io.quarkus.platform:*"
        update-types:
          - "version-update:semver-major"
      # Pin Apache Jena to 5.x
      - dependency-name: "org.apache.jena:*"
        versions: [">=6.0.0"]
    groups:
      plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "com.mycila:license-maven-plugin"
          - "org.jacoco:jacoco-maven-plugin"
          - "org.sonarsource.scanner.maven:sonar-maven-plugin"
          - "org.sonatype.plugins:nexus-staging-maven-plugin"
          - "org.owasp:dependency-check-maven"
          - "com.puppycrawl.tools:checkstyle"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

