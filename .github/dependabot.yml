version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      gh-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"

# 1.3 Maintenance
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "1.3"
    ignore:
      - dependency-name: "org.eclipse.rdf4j:rdf4j-*"
      - dependency-name: "org.springframework.security:spring-*"
      - dependency-name: "com.google.protobuf:protobuf-java"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.junit.jupiter:junit-*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.junit:junit-*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "backport"
      - "1.3"

  - package-ecosystem: "maven"
    directory: "/rdf4j/"
    schedule:
      interval: "weekly"
    target-branch: "1.3"
    allow:
      - dependency-name: "org.eclipse.rdf4j:rdf4j-*"
    labels:
      - "backport"
      - "1.3"

  - package-ecosystem: "maven"
    directory: "/spring/"
    schedule:
      interval: "weekly"
    target-branch: "1.3"
    allow:
      - dependency-name: "org.springframework.security:spring-*"
    labels:
      - "backport"
      - "1.3"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      gh-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    target-branch: "1.3"
    labels:
      - "backport"
      - "1.3"
